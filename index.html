<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<title>Renko Retail · Statistiche</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Crect x='14' y='30' width='8' height='20' rx='2' fill='white'/%3E%3Crect x='28' y='16' width='8' height='34' rx='2' fill='white'/%3E%3Crect x='42' y='24' width='8' height='26' rx='2' fill='white'/%3E%3C/svg%3E">
<style>
/* ===================== CONFIGURAZIONE =====================
   Inserisci qui URL e chiave anon del progetto Supabase
   (Supabase > Project Settings > API)                       */
</style>
<script>
const SUPABASE_URL = 'https://XXXXXXXX.supabase.co';
const SUPABASE_KEY = 'INCOLLA-QUI-LA-CHIAVE-ANON';
</script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#f8f9fb; --line:#e6e7eb; --grid:#eceef2;
  --ink:#111318; --ink-2:#4b5060; --ink-3:#7c8191;
  --brand:#4f46e5; --brand-ink:#ffffff; --head:#1e1b4b;
  --series-1:#2a78d6; --series-1-soft:#cde2fb;
  --good:#15803d; --good-bg:#ecfdf3; --bad:#b91c1c; --bad-bg:#fef2f2; --warn:#b45309; --warn-bg:#fffbeb;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#121214; --surface:#1a1a19; --surface-2:#222221; --line:#2e2e2c; --grid:#2a2a28;
    --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#8f8e86;
    --head:#17153a; --series-1:#3987e5; --series-1-soft:#1c3555;
    --good:#4ade80; --good-bg:#11291b; --bad:#f87171; --bad-bg:#2c1414; --warn:#fbbf24; --warn-bg:#2b230f;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* --- login --- */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#1e1b4b,#312e81)}
.login-card{background:var(--surface);border-radius:18px;padding:32px;width:min(380px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card h1{margin:12px 0 4px;font-size:20px}
.login-card p{margin:0 0 20px;color:var(--ink-3)}
.logo{width:42px;height:42px;border-radius:11px;background:var(--brand);display:grid;place-items:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],input[type=number],select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);outline:none}
input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}

/* --- app shell --- */
header.top{background:var(--head);color:#fff;padding:0 20px;position:sticky;top:0;z-index:20}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:14px;height:56px}
.top-in .logo{width:32px;height:32px;border-radius:8px}
.brand{font-weight:600;font-size:15px}
.brand small{display:block;font-weight:400;opacity:.65;font-size:11px}
.sp{flex:1}
header select{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2);width:auto;max-width:260px}
header select option{color:#111}
.user{font-size:12px;opacity:.8}
header .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
header .btn:hover{background:rgba(255,255,255,.1)}
nav.tabs{max-width:1280px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:#fff;border-bottom-color:#a5b4fc}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}

/* filtri: una riga sopra i grafici */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--brand);color:#fff}
.range{display:flex;gap:6px;align-items:center}
.range input{width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.chip.on{border-color:var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface));font-weight:600}
.period-lbl{color:var(--ink-3);font-size:13px;margin-left:auto}
.exp{display:inline-flex;align-items:center;gap:6px}
.exp span{font-size:12px;color:var(--ink-3)}
.exp button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.exp button:hover{border-color:var(--brand);color:var(--brand)}
.exp button i{font-style:normal;font-size:10px;padding:1px 4px;border-radius:4px;color:#fff}
.exp .b-csv i{background:#6b7280}.exp .b-xlsx i{background:#15803d}.exp .b-pdf i{background:#b91c1c}
.pv td:first-child,.pv th:first-child{position:sticky;left:0;background:var(--surface)}
.pv tfoot td{font-weight:700;border-top:2px solid var(--ink-2);background:var(--surface-2);position:sticky;bottom:0}
.pv tfoot td:first-child{background:var(--surface-2);z-index:2}
.paycard .val{font-size:22px}
.paycard .bar{height:6px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.paycard .bar span{display:block;height:100%;background:var(--series-1);border-radius:0 3px 3px 0}

/* card */
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 2px;font-size:14px;font-weight:600}
.card .sub{color:var(--ink-3);font-size:12px;margin-bottom:12px}
.card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.card-head>div:first-child{flex:1}
.kpi .lbl{color:var(--ink-2);font-size:12px;font-weight:500}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:4px 0 2px}
.kpi .cmp{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .cmp .delta{white-space:nowrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;padding:1px 6px;border-radius:6px}
.delta.up{color:var(--good);background:var(--good-bg)}
.delta.down{color:var(--bad);background:var(--bad-bg)}
.delta.flat{color:var(--ink-2);background:var(--surface-2)}
.section-gap{height:14px}

/* grafici SVG */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.chart .axis text{fill:var(--ink-3);font-size:11px}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--series-1)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart g.col:hover .bar{fill:color-mix(in srgb,var(--series-1) 78%,var(--ink))}
.chart g.col:hover .hl{fill:var(--surface-2)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);padding:7px 10px;border-radius:8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{display:block;font-size:13px}

/* barre orizzontali (reparti, pagamenti...) */
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:13px}
.hb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hb .tr{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hb .fl{height:100%;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.hb .v small{color:var(--ink-3);margin-left:6px;display:inline-block;min-width:40px}

/* tabelle */
.tbl-wrap{overflow:auto;max-height:640px;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
th.r,td.r{text-align:right}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
tr:hover td{background:var(--surface-2)}
td .minibar{height:6px;background:var(--series-1);border-radius:0 3px 3px 0;margin-top:4px;opacity:.85}
.muted{color:var(--ink-3)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=search]{max-width:320px}

/* scontrini */
.rc{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface)}
.rc-h{display:grid;grid-template-columns:150px 1fr auto auto;gap:12px;padding:10px 14px;cursor:pointer;align-items:center}
.rc-h:hover{background:var(--surface-2)}
.rc-b{padding:0 14px 12px;display:none}
.rc.open .rc-b{display:block}
.rc-b table td{padding:5px 8px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* admin */
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px}
.status.on{color:var(--good);background:var(--good-bg)}
.status.off{color:var(--bad);background:var(--bad-bg)}
.status.wait{color:var(--warn);background:var(--warn-bg)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 12px;font-size:13px}
.kv b{color:var(--ink-3);font-weight:500}
code.copy{font-family:Consolas,ui-monospace,monospace;font-size:12px;background:var(--surface-2);border:1px solid var(--line);padding:3px 7px;border-radius:6px;cursor:pointer;word-break:break-all}
code.copy:hover{border-color:var(--brand)}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.loading{opacity:.55;pointer-events:none;transition:opacity .2s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:99;font-size:13px}
@media (max-width:640px){
  main{padding:12px 12px 50px}
  .g-2{grid-template-columns:1fr}
  .kpi .val{font-size:22px}
  .rc-h{grid-template-columns:1fr auto}
  .rc-h .hide-m{display:none}
  .user{display:none}
  .period-lbl{margin-left:0;width:100%}
  .exp span{display:none}
}
</style>

<!-- ============ LOGIN ============ -->

    <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="11" width="4" height="9" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="17" y="8" width="4" height="12" rx="1"/></svg></div>

<script>
'use strict';
/* ====================================================================
   Accesso a Supabase senza librerie: Auth (GoTrue) + RPC (PostgREST)
   ==================================================================== */
const BASE = SUPABASE_URL.replace(/\/+$/,'');
const SKEY = 'rrs_sessione';
let sess = null;
try { sess = JSON.parse(localStorage.getItem(SKEY)||'null'); } catch(e){}

async function authCall(path, body){
  const r = await fetch(`${BASE}/auth/v1/${path}`, {method:'POST', headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || 'Accesso non riuscito');
  return j;
}
function salvaSess(j){
  sess = {access_token:j.access_token, refresh_token:j.refresh_token, expires_at: Date.now() + (j.expires_in||3600)*1000, email:j.user?.email || sess?.email};
  try{ localStorage.setItem(SKEY, JSON.stringify(sess)); }catch(e){}
}
async function login(email, pass){ salvaSess(await authCall('token?grant_type=password', {email, password:pass})); }
async function refresh(){
  if(!sess?.refresh_token) throw new Error('sessione scaduta');
  salvaSess(await authCall('token?grant_type=refresh_token', {refresh_token:sess.refresh_token}));
}
function logout(){
  if(sess?.access_token) fetch(`${BASE}/auth/v1/logout`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+sess.access_token}}).catch(()=>{});
  sess=null; try{localStorage.removeItem(SKEY);}catch(e){}
  mostraLogin();
}
async function rpc(fn, args={}, retry=true){
  if(sess && Date.now() > sess.expires_at - 60000){ try{ await refresh(); }catch(e){ logout(); throw e; } }
  // chiave nuova (sb_publishable_...) solo in "apikey": in Authorization va solo il JWT dell'utente
  const h={'apikey':SUPABASE_KEY,'Content-Type':'application/json'};
  if(sess?.access_token) h.Authorization='Bearer '+sess.access_token;
  else if(SUPABASE_KEY.startsWith('eyJ')) h.Authorization='Bearer '+SUPABASE_KEY;
  const r = await fetch(`${BASE}/rest/v1/rpc/${fn}`, {method:'POST', headers:h, body:JSON.stringify(args)});
  if(r.status===401 && retry){ try{ await refresh(); return rpc(fn,args,false); }catch(e){ logout(); throw e; } }
  const j = await r.json().catch(()=>null);
  if(!r.ok) throw new Error(j?.message || ('Errore '+r.status));
  return j;
}

/* ====================================================================
   Utilità
   ==================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fEur  = v => (Number(v)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const fEur0 = v => (Number(v)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const fNum  = (v,d=0) => (Number(v)||0).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d});
const fQta  = v => { const n=Number(v)||0; return Number.isInteger(n)?fNum(n):fNum(n,2); };
const fPct  = v => (Number(v)||0).toLocaleString('it-IT',{style:'percent',maximumFractionDigits:1});
const iso   = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const pIso  = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const fData = s => pIso(String(s).slice(0,10)).toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'});
const fDataBreve = s => pIso(String(s).slice(0,10)).toLocaleDateString('it-IT',{day:'2-digit',month:'short'});
const fOra  = s => String(s).slice(11,16);
const GIORNI = ['','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.remove('hidden'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.add('hidden'),3000); }
function copia(t){ (navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>toast('Copiato'),()=>{ prompt('Copia:',t); }); }
function scaricaCSV(nome, righe){
  const csv = righe.map(r=>r.map(v=>{ const s=String(v??''); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'})); a.download=nome; a.click();
}
const ls = { get:(k,d)=>{ try{ const v=localStorage.getItem('rrs_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
             set:(k,v)=>{ try{ localStorage.setItem('rrs_'+k,JSON.stringify(v)); }catch(e){} } };

/* ====================================================================
   Stato
   ==================================================================== */
const S = {
  ctx:null, negozio:null, post:new Set(ls.get('post',[])),
  preset: ls.get('preset','oggi'), dal:null, al:null,
  tab: ls.get('tab','panoramica'),
  stat:null, artSort:{k:'importo',dir:-1}, artQ:'', scQ:''
};
function negozio(){ return S.ctx?.negozi.find(n=>n.id===S.negozio); }

function calcolaPeriodo(p){
  const oggi=new Date(); oggi.setHours(0,0,0,0);
  const d=new Date(oggi);
  switch(p){
    case 'oggi': return [oggi,oggi];
    case 'ieri': d.setDate(d.getDate()-1); return [d,d];
    case '7g': d.setDate(d.getDate()-6); return [d,oggi];
    case 'mese': return [new Date(oggi.getFullYear(),oggi.getMonth(),1),oggi];
    case 'mesep': return [new Date(oggi.getFullYear(),oggi.getMonth()-1,1),new Date(oggi.getFullYear(),oggi.getMonth(),0)];
    case 'anno': return [new Date(oggi.getFullYear(),0,1),oggi];
    case 'annop': return [new Date(oggi.getFullYear()-1,0,1),new Date(oggi.getFullYear()-1,11,31)];
  }
  return [pIso(S.dal||iso(oggi)), pIso(S.al||iso(oggi))];
}
function impostaPreset(p){
  S.preset=p; ls.set('preset',p);
  if(p!=='custom'){ const [a,b]=calcolaPeriodo(p); S.dal=iso(a); S.al=iso(b); }
  else { S.dal = S.dal || ls.get('dal', iso(new Date())); S.al = S.al || ls.get('al', iso(new Date())); }
  $('dDal').value=S.dal; $('dAl').value=S.al;
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('customRange').classList.toggle('hidden',p!=='custom');
}
// periodo di confronto: stesso periodo "omologo" (non i giorni subito prima)
function periodoConfronto(){
  const a=pIso(S.dal), b=pIso(S.al), add=(d,n)=>{ const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const fineMese=(y,m)=>new Date(y,m+1,0).getDate();
  const indietroMesi=(d,n)=>{ const y=d.getFullYear(), m=d.getMonth()-n; return new Date(y,m,Math.min(d.getDate(),fineMese(y,m))); };
  switch(S.preset){
    case 'oggi': case 'ieri': return [add(a,-7),add(b,-7)];                    // stesso giorno della settimana prima
    case 'mese': case 'mesep': return [indietroMesi(a,1), indietroMesi(b,1)];  // stessi giorni del mese prima
    case 'anno': case 'annop': return [new Date(a.getFullYear()-1,a.getMonth(),a.getDate()), new Date(b.getFullYear()-1,b.getMonth(),Math.min(b.getDate(),fineMese(b.getFullYear()-1,b.getMonth())))];
  }
  const n=Math.round((b-a)/864e5)+1; return [add(a,-n),add(a,-1)];
}
function etichettaPeriodo(){
  if(S.dal===S.al) return pIso(S.dal).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  return `dal ${fData(S.dal)} al ${fData(S.al)}`;
}

function disegnaChips(){
  const n=negozio(); const box=$('chips');
  const ps=n?.postazioni||[];
  if(ps.length<2){ box.innerHTML=''; S.post.clear(); return; }
  for(const id of [...S.post]) if(!ps.some(p=>p.id===id)) S.post.delete(id);
  box.innerHTML = `<button class="chip ${S.post.size===0?'on':''}" data-id="">Tutte le postazioni</button>` +
    ps.map(p=>`<button class="chip ${S.post.has(p.id)?'on':''}" data-id="${p.id}">${esc(p.nome)}</button>`).join('');
  box.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const id=c.dataset.id;
    if(!id) S.post.clear(); else S.post.has(id)?S.post.delete(id):S.post.add(id);
    if(S.post.size===ps.length) S.post.clear();
    ls.set('post',[...S.post]); disegnaChips(); carica();
  });
}

/* ====================================================================
   Caricamento dati
   ==================================================================== */
let reqN=0;
async function carica(){
  const v=$('view');
  $('periodLbl').textContent = etichettaPeriodo();
  if(!S.negozio && S.tab!=='admin'){ v.innerHTML='<div class="card empty">Nessun negozio associato al tuo utente.</div>'; return; }
  const my=++reqN; v.classList.add('loading');
  try{
    if(S.tab==='admin'){ await vistaAdmin(); }
    else if(S.tab==='scontrini'){ await vistaScontrini(my); }
    else if(S.tab==='pagamenti'){
      const pg = await rpc('pagamenti',{p_negozio:S.negozio,p_postazioni:[...S.post],p_dal:S.dal,p_al:S.al});
      if(my!==reqN) return; S.pag=pg; vistaPagamenti(pg);
    }
    else {
      const [pd,pa]=periodoConfronto();
      const st = await rpc('statistiche',{p_negozio:S.negozio,p_postazioni:[...S.post],p_dal:S.dal,p_al:S.al,p_prec_dal:iso(pd),p_prec_al:iso(pa)});
      if(my!==reqN) return; S.stat=st;
      if(S.tab==='panoramica') vistaPanoramica(st);
      else if(S.tab==='articoli') vistaArticoli(st);
      else if(S.tab==='chiusure') vistaChiusure(st);
    }
  }catch(e){ if(my===reqN) v.innerHTML=`<div class="card empty">Errore: ${esc(e.message)}</div>`; }
  finally{ if(my===reqN) v.classList.remove('loading'); }
}

/* ====================================================================
   Grafici SVG (barre verticali, una serie, tooltip al passaggio)
   ==================================================================== */
function scalaNice(max){
  if(max<=0) return {top:1,step:.25};
  const raw=max/4, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p;
  const step=(m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;
  return {top:Math.ceil(max/step)*step, step};
}
function fAsse(v){ return v>=1000 ? (v/1000).toLocaleString('it-IT',{maximumFractionDigits:1})+'k' : v.toLocaleString('it-IT',{maximumFractionDigits:2}); }

function barChart(el, dati, {h=220, fmt=fEur, tip, evid=null}={}){
  // dati: [{x:'etichetta asse', v:numero, t:'titolo tooltip', extra:'riga 2'}]
  el.innerHTML=''; el.classList.add('chart');
  const W = Math.max(el.clientWidth||600, 260), padL=46, padR=6, padT=8, padB=24;
  const iw=W-padL-padR, ih=h-padT-padB, n=dati.length||1, band=iw/n;
  const max=Math.max(0,...dati.map(d=>d.v)); const {top,step}=scalaNice(max);
  const y=v=>padT+ih-(v/top)*ih;
  const bw=Math.max(2,Math.min(28,band*0.62));
  const ogni=Math.ceil(n/Math.max(1,Math.floor(iw/46)));
  let s=`<svg viewBox="0 0 ${W} ${h}" height="${h}" role="img"><g class="axis">`;
  for(let t=0;t<=top+1e-9;t+=step){ s+=`<line class="gridl" x1="${padL}" x2="${W-padR}" y1="${y(t)}" y2="${y(t)}"/><text x="${padL-8}" y="${y(t)+4}" text-anchor="end">${fAsse(t)}</text>`; }
  dati.forEach((d,i)=>{ if(i%ogni===0) s+=`<text x="${padL+band*i+band/2}" y="${h-6}" text-anchor="middle">${esc(d.x)}</text>`; });
  s+=`</g>`;
  dati.forEach((d,i)=>{
    const cx=padL+band*i+band/2, x=cx-bw/2, yy=y(Math.max(0,d.v)), hh=padT+ih-yy, r=Math.min(4,bw/2,hh);
    const path = hh<=0 ? '' : `M${x},${padT+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${padT+ih} Z`;
    s+=`<g class="col" data-i="${i}"><rect class="hl" x="${padL+band*i}" y="${padT}" width="${band}" height="${ih}" fill="transparent"/>`+
       (path?`<path class="bar" d="${path}"${evid!=null&&evid!==i?' style="opacity:.55"':''}/>`:'')+`</g>`;
  });
  s+=`<line class="base" x1="${padL}" x2="${W-padR}" y1="${padT+ih}" y2="${padT+ih}"/></svg>`;
  el.innerHTML=s;
  const tipEl=document.createElement('div'); tipEl.className='tip hidden'; el.appendChild(tipEl);
  el.querySelectorAll('g.col').forEach(g=>{
    g.addEventListener('mouseenter',()=>{
      const d=dati[+g.dataset.i]; const cx=padL+band*(+g.dataset.i)+band/2;
      tipEl.innerHTML=`<span>${esc(d.t||d.x)}</span><b>${fmt(d.v)}</b>${d.extra?`<span>${esc(d.extra)}</span>`:''}`;
      const rect=el.getBoundingClientRect(), sc=rect.width/W;
      tipEl.style.left=Math.min(Math.max(cx*sc,70),rect.width-70)+'px'; tipEl.style.top=(y(Math.max(0,d.v))*sc)+'px';
      tipEl.classList.remove('hidden');
    });
    g.addEventListener('mouseleave',()=>tipEl.classList.add('hidden'));
  });
}
function hbars(lista, {lbl, val, fmt=fEur, tot}){
  if(!lista.length) return '<div class="muted">Nessun dato</div>';
  const max=Math.max(...lista.map(val)); const T=tot ?? lista.reduce((a,b)=>a+val(b),0);
  return '<div class="hbars">'+lista.map(o=>`<div class="hb" title="${esc(lbl(o))}"><span class="nm">${esc(lbl(o))}</span>
    <span class="tr"><span class="fl" style="display:block;width:${max>0?Math.max(0,val(o))/max*100:0}%"></span></span>
    <span class="v">${fmt(val(o))}<small>${T>0?fPct(val(o)/T):''}</small></span></div>`).join('')+'</div>';
}
function delta(cur, prev){
  if(!prev) return `<span class="delta flat">—</span>`;
  const d=(cur-prev)/Math.abs(prev);
  if(Math.abs(d)<0.005) return `<span class="delta flat">= 0%</span>`;
  return `<span class="delta ${d>0?'up':'down'}" title="${d>0?'In aumento':'In calo'}">${d>0?'▲':'▼'} ${fPct(Math.abs(d))}</span>`;
}

/* ====================================================================
   Vista: Panoramica
   ==================================================================== */
function raggruppaAndamento(giorni){
  const n=giorni.length;
  if(n<=62) return {titolo:'Incasso per giorno', dati:giorni.map(g=>({x:fDataBreve(g.g), v:+g.incasso, t:pIso(g.g).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long'}), extra:`${fNum(g.scontrini)} scontrini`}))};
  const perMese = n>190;
  const m=new Map();
  giorni.forEach(g=>{
    const d=pIso(g.g); let k,lab,t;
    if(perMese){ k=`${d.getFullYear()}-${d.getMonth()}`; lab=`${MESI[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`; t=d.toLocaleDateString('it-IT',{month:'long',year:'numeric'}); }
    else { const l=new Date(d); l.setDate(d.getDate()-((d.getDay()+6)%7)); k=iso(l); lab=fDataBreve(k); t='Settimana dal '+fData(k); }
    const o=m.get(k)||{x:lab,v:0,t,n:0}; o.v+=+g.incasso; o.n+=g.scontrini; m.set(k,o);
  });
  return {titolo: perMese?'Incasso per mese':'Incasso per settimana', dati:[...m.values()].map(o=>({...o,extra:`${fNum(o.n)} scontrini`}))};
}
function vistaPanoramica(st){
  const k=st.kpi, p=st.kpi_prec, v=$('view');
  const P=st.periodo, prevLbl = P.prec_dal===P.prec_al ? `vs ${pIso(P.prec_dal).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}`
        : `vs ${fDataBreve(P.prec_dal)}–${fDataBreve(P.prec_al)}${String(P.prec_dal).slice(0,4)!==String(S.dal).slice(0,4)?' '+String(P.prec_al).slice(0,4):''}`;
  if(!k.scontrini){
    v.innerHTML=`<div class="card empty">Nessuno scontrino nel periodo selezionato.<br><span class="muted">Periodo di confronto: ${fEur(p.incasso)} · ${fNum(p.scontrini)} scontrini</span></div>`; return;
  }
  const and=raggruppaAndamento(st.giorni);
  const totRep=st.reparti.reduce((a,b)=>a+(+b.importo),0);
  const settimana=[1,2,3,4,5,6,7].map(d=>{ const o=st.settimana.find(x=>x.dow===d); return {x:GIORNI[d].slice(0,3), v:o&&o.giorni?o.incasso/o.giorni:0, t:GIORNI[d], extra:o?`media su ${o.giorni} giorni · ${fNum(o.scontrini)} scontrini`:'nessun dato'}; });
  const oreMin=Math.min(...st.ore.map(o=>o.h)), oreMax=Math.max(...st.ore.map(o=>o.h));
  const ore=[]; for(let h=oreMin;h<=oreMax;h++){ const o=st.ore.find(x=>x.h===h); ore.push({x:String(h).padStart(2,'0'), v:o?+o.incasso:0, t:`${String(h).padStart(2,'0')}:00 – ${String(h).padStart(2,'0')}:59`, extra:o?`${fNum(o.scontrini)} scontrini`:''}); }
  v.innerHTML=`
  <div class="grid g-kpi">
    <div class="card kpi"><div class="lbl">Incasso</div><div class="val num">${fEur(k.incasso)}</div><div class="cmp">${delta(k.incasso,p.incasso)}<span title="${fEur(p.incasso)}">${prevLbl}</span></div></div>
    <div class="card kpi"><div class="lbl">Scontrini</div><div class="val num">${fNum(k.scontrini)}</div><div class="cmp">${delta(k.scontrini,p.scontrini)}<span>${fNum(p.scontrini)} prima</span></div></div>
    <div class="card kpi"><div class="lbl">Scontrino medio</div><div class="val num">${fEur(k.medio)}</div><div class="cmp">${delta(k.medio,p.medio)}<span>${fEur(p.medio)} prima</span></div></div>
    <div class="card kpi"><div class="lbl">Pezzi venduti</div><div class="val num">${fQta(k.pezzi)}</div><div class="cmp">${delta(k.pezzi,p.pezzi)}<span>${fQta(p.pezzi)} prima</span></div></div>
    <div class="card kpi"><div class="lbl">Sconti</div><div class="val num">${fEur(Math.abs(k.sconti))}</div><div class="cmp"><span>${k.lordo?fPct(Math.abs(k.sconti)/k.lordo):'0%'} del venduto lordo</span></div></div>
  </div>
  <div class="section-gap"></div>
  ${st.giorni.length>1?`<div class="card"><div class="card-head"><div><h3>${and.titolo}</h3><div class="sub">${fNum(k.giorni_aperti)} giorni con vendite · media ${fEur(k.incasso/Math.max(1,k.giorni_aperti))} al giorno</div></div></div><div id="chAnd"></div></div><div class="section-gap"></div>`:''}
  <div class="grid g-2">
    <div class="card"><h3>Fasce orarie</h3><div class="sub">Incasso per ora di emissione dello scontrino</div><div id="chOre"></div></div>
    ${st.giorni.length>=7?`<div class="card"><h3>Giorni della settimana</h3><div class="sub">Incasso medio per giorno di apertura</div><div id="chSett"></div></div>`:''}
    <div class="card"><h3>Reparti</h3><div class="sub">Venduto netto (dopo sconti)</div>${hbars(st.reparti,{lbl:o=>o.reparto,val:o=>+o.importo,tot:totRep})}</div>
    <div class="card"><h3>Pagamenti</h3><div class="sub">Incassato per tipo di pagamento</div>${hbars(st.pagamenti,{lbl:o=>`${o.pagamento} (${fNum(o.n)})`,val:o=>+o.importo})}</div>
    <div class="card"><div class="card-head"><div><h3>Articoli più venduti</h3><div class="sub">Primi 10 per incasso</div></div><button class="btn sm" onclick="attivaTab('articoli')">Tutti</button></div>
      ${hbars(st.articoli.slice(0,10),{lbl:o=>`${o.articolo||'(senza descrizione)'} · ${fQta(o.quantita)} pz`,val:o=>+o.importo,tot:totRep})}</div>
    ${st.postazioni.length>1?`<div class="card"><h3>Postazioni</h3><div class="sub">Incasso per cassa</div>${hbars(st.postazioni,{lbl:o=>`${o.postazione} (${fNum(o.scontrini)})`,val:o=>+o.incasso})}</div>`:''}
    <div class="card"><h3>IVA</h3><div class="sub">Scorporo sul venduto netto</div>
      <div class="tbl-wrap"><table><thead><tr><th>Aliquota</th><th class="r">Imponibile</th><th class="r">Imposta</th><th class="r">Totale</th></tr></thead><tbody>
      ${st.iva.map(i=>`<tr><td>${fNum(i.aliquota,0)}%</td><td class="r">${fEur(i.imponibile)}</td><td class="r">${fEur(i.imposta)}</td><td class="r">${fEur(i.totale)}</td></tr>`).join('')}
      <tr><td><b>Totale</b></td><td class="r"><b>${fEur(st.iva.reduce((a,b)=>a+ +b.imponibile,0))}</b></td><td class="r"><b>${fEur(st.iva.reduce((a,b)=>a+ +b.imposta,0))}</b></td><td class="r"><b>${fEur(st.iva.reduce((a,b)=>a+ +b.totale,0))}</b></td></tr>
      </tbody></table></div></div>
    ${st.operatori.length>1?`<div class="card"><h3>Operatori</h3><div class="sub">Incasso per operatore</div>${hbars(st.operatori,{lbl:o=>`${o.operatore} (${fNum(o.scontrini)})`,val:o=>+o.incasso})}</div>`:''}
  </div>`;
  const draw=()=>{
    if($('chAnd')) barChart($('chAnd'), and.dati, {h:240});
    barChart($('chOre'), ore, {h:200});
    if($('chSett')) barChart($('chSett'), settimana, {h:200});
  };
  draw(); window.onresize=()=>{ clearTimeout(draw.t); draw.t=setTimeout(()=>S.tab==='panoramica'&&draw(),150); };
}

function vistaArticoli(st){
  const v=$('view'); window.onresize=null;
  v.innerHTML=`<div class="card">
    <div class="toolbar"><input type="search" id="artQ" placeholder="Cerca articolo, codice o reparto…" value="${esc(S.artQ)}">
      <span class="muted" id="artN"></span></div>
    <div class="tbl-wrap"><table><thead><tr>
      <th class="sort" data-k="articolo">Articolo</th><th class="sort" data-k="reparto">Reparto</th>
      <th class="sort r" data-k="quantita">Quantità</th><th class="sort r" data-k="sconti">Sconti</th>
      <th class="sort r" data-k="importo">Incasso netto</th><th class="r">Quota</th></tr></thead><tbody id="artBody"></tbody></table></div>
    <div class="sub" style="margin-top:8px">Sono mostrati al massimo i 500 articoli con più incasso nel periodo.</div></div>`;
  const tot=st.articoli.reduce((a,b)=>a+ +b.importo,0);
  const disegna=()=>{
    const q=S.artQ.toLowerCase(), {k,dir}=S.artSort;
    let l=st.articoli.filter(a=>!q||[a.articolo,a.cod,a.reparto].some(x=>String(x||'').toLowerCase().includes(q)));
    l.sort((a,b)=>{ const x=a[k],y=b[k]; return (typeof x==='string'||typeof y==='string'?String(x||'').localeCompare(String(y||'')):(+x)-(+y))*dir; });
    S.artView=l; const max=Math.max(1,...l.map(a=>+a.importo));
    $('artN').textContent=`${fNum(l.length)} articoli`;
    $('artBody').innerHTML=l.map(a=>`<tr><td>${esc(a.articolo||'(senza descrizione)')}<div class="muted" style="font-size:11px">${esc(a.cod||'')}</div></td><td>${esc(a.reparto||'')}</td>
      <td class="r">${fQta(a.quantita)}</td><td class="r">${+a.sconti?fEur(a.sconti):'<span class="muted">—</span>'}</td>
      <td class="r">${fEur(a.importo)}<div class="minibar" style="width:${Math.max(0,+a.importo)/max*100}%;margin-left:auto"></div></td><td class="r muted">${tot?fPct(a.importo/tot):''}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nessun articolo</td></tr>';
    document.querySelectorAll('th.sort').forEach(t=>{ t.textContent=t.textContent.replace(/ [▲▼]$/,''); if(t.dataset.k===k) t.textContent+=dir>0?' ▲':' ▼'; });

function pivot(lista, chiave, ordinePag){
  // lista [{..., pagamento, importo, n}] -> righe [{k, cells:{pag:importo}, tot, n}]
  const m=new Map();
  lista.forEach(o=>{ const k=chiave(o); const r=m.get(k)||{k, src:o, cells:{}, tot:0, n:0}; r.cells[o.pagamento]=(r.cells[o.pagamento]||0)+ +o.importo; r.tot+= +o.importo; r.n+= +o.n; m.set(k,r); });
  return [...m.values()];
}
function tabellaPivot(id, titolo, sub, intest, righe, paga, celleChiave){
  const totCol=paga.map(p=>righe.reduce((a,r)=>a+(r.cells[p]||0),0)), tt=totCol.reduce((a,b)=>a+b,0);
  return `<div class="card"><h3>${titolo}</h3><div class="sub">${sub}</div><div class="tbl-wrap pv"><table id="${id}"><thead><tr>${intest.map(h=>`<th>${h}</th>`).join('')}
    ${paga.map(p=>`<th class="r">${esc(p)}</th>`).join('')}<th class="r">Totale</th><th class="r">Scontrini</th></tr></thead><tbody>
    ${righe.map(r=>`<tr>${celleChiave(r)}${paga.map(p=>`<td class="r">${r.cells[p]?fEur(r.cells[p]):'<span class="muted">—</span>'}</td>`).join('')}<td class="r"><b>${fEur(r.tot)}</b></td><td class="r muted">${fNum(r.n)}</td></tr>`).join('') || `<tr><td colspan="${intest.length+paga.length+2}" class="empty">Nessun dato</td></tr>`}
    </tbody>${righe.length>1?`<tfoot><tr><td colspan="${intest.length}">Totale</td>${totCol.map(v=>`<td class="r">${fEur(v)}</td>`).join('')}<td class="r">${fEur(tt)}</td><td class="r">${fNum(righe.reduce((a,r)=>a+r.n,0))}</td></tr></tfoot>`:''}</table></div></div>`;
}
function datiPagamenti(pg){
  const paga=pg.totali.map(t=>t.pagamento);
  const giorni=pivot(pg.giorni,o=>o.g,paga).sort((a,b)=>a.k<b.k?1:-1);
  const z=pivot(pg.chiusure,o=>o.matricola+'|'+o.z,paga).sort((a,b)=>a.src.giorno<b.src.giorno?1:a.src.giorno>b.src.giorno?-1:b.src.z-a.src.z);
  const ore=pivot(pg.ore,o=>o.h,paga).sort((a,b)=>a.k-b.k);
  const pos=pivot(pg.postazioni,o=>o.postazione,paga).sort((a,b)=>b.tot-a.tot);
  const op=pivot(pg.operatori,o=>o.operatore,paga).sort((a,b)=>b.tot-a.tot);
  return {paga,giorni,z,ore,pos,op};
}

function statoSpooler(sp){
  if(!sp.ultimo_contatto) return `<span class="status wait">● Mai collegato</span>`;
  const min=(Date.now()-new Date(sp.ultimo_contatto))/60000;
  if(sp.ultimo_errore) return `<span class="status off">⚠ Errore</span>`;
  if(min<=10) return `<span class="status on">● Online</span>`;
  const t = min<120?`${Math.round(min)} min`: min<2880?`${Math.round(min/60)} ore`:`${Math.round(min/1440)} giorni`;
  return `<span class="status off">○ Non risponde da ${t}</span>`;
}

/* ====================================================================
   ESPORTAZIONI: CSV · Excel (.xlsx formattato) · PDF — senza librerie
   Modello report: {titolo, sottotitolo, file, sezioni:[{nome, colonne:[{t,tipo,somma}], righe:[[...]], totale:[...], grafico:{dati:[{x,v}],fmt}}]}
   tipi: testo | eur | int | dec | pct | data | dataora
   ==================================================================== */
const EXP = (()=>{
  const enc = new TextEncoder();
  const scarica = (nome, blob)=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); };
  const cell = (v, col)=> (v && typeof v==='object' && 'v' in v) ? v : {v, tipo:col.tipo};
  const isNum = t => ['eur','int','dec','pct'].includes(t);

  /* ---------------- CSV (separatore ; e virgola decimale, per Excel italiano) ---------------- */
  function csvVal(c){
    const {v,tipo}=c; if(v==null||v==='') return '';
    if(isNum(tipo)){ const n=Number(v); if(!isFinite(n)) return csvVal({v,tipo:'testo'}); return tipo==='pct' ? (n*100).toFixed(2).replace('.',',')+'%' : (tipo==='int'?String(Math.round(n)):n.toFixed(2).replace('.',',')); }
    const iso=/^\d{4}-\d{2}-\d{2}/.test(String(v));
    if(tipo==='data'&&iso) return fData(v);
    if(tipo==='dataora'&&iso) return fData(v)+' '+String(v).slice(11,16);
    const s=String(v); return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
  }
  function csv(rep){
    const L=[[rep.titolo],[rep.sottotitolo],[]].map(r=>r.map(x=>csvVal({v:x,tipo:'testo'})).join(';'));
    rep.sezioni.filter(s=>s.colonne).forEach((s,i)=>{
      if(rep.sezioni.length>1){ if(i) L.push(''); L.push(csvVal({v:s.nome,tipo:'testo'})); }
      L.push(s.colonne.map(c=>csvVal({v:c.t,tipo:'testo'})).join(';'));
      s.righe.forEach(r=>L.push(r.map((v,j)=>csvVal(cell(v,s.colonne[j]))).join(';')));
      if(s.totale) L.push(s.totale.map((v,j)=>csvVal(cell(v,s.colonne[j]))).join(';'));
    });
    scarica(rep.file+'.csv', new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  }

  /* ---------------- ZIP (store) per XLSX ---------------- */
  const CRC=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
  const crc32=b=>{ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
  function zip(files){
    const parts=[], central=[]; let off=0;
    const u16=n=>[n&255,(n>>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
    for(const [name,str] of files){
      const nm=enc.encode(name), data=enc.encode(str), c=crc32(data);
      const head=[...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)];
      parts.push(new Uint8Array(head),nm,data);
      central.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
      off+=head.length+nm.length+data.length;
    }
    const csize=central.reduce((a,b)=>a+b.length,0);
    const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);
    return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }

  /* ---------------- XLSX ---------------- */
  const xesc=s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const colL=i=>{ let s=''; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; };
  const serial=v=>{ const s=String(v); const d=Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)); let x=(d-Date.UTC(1899,11,30))/864e5;
    if(s.length>=16){ x+=(+s.slice(11,13)*60 + +s.slice(14,16))/1440; } return x; };
  // stili: 0 normale,1 titolo,2 sottotitolo,3 intestazione, 4..10 corpo, 11..17 totale
  const TIPI=['testo','eur','int','dec','pct','data','dataora'];
  const STYLES=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="5"><numFmt numFmtId="164" formatCode="#,##0.00\\ &quot;€&quot;"/><numFmt numFmtId="165" formatCode="0.0%"/><numFmt numFmtId="166" formatCode="dd/mm/yyyy"/><numFmt numFmtId="167" formatCode="dd/mm/yyyy\\ hh:mm"/><numFmt numFmtId="168" formatCode="#,##0.00"/></numFmts>
<fonts count="5"><font><sz val="11"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="15"/><color rgb="FF1E1B4B"/><name val="Calibri"/><family val="2"/></font><font><i/><sz val="10"/><color rgb="FF6B7280"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/><family val="2"/></font><font><b/><sz val="11"/><name val="Calibri"/><family val="2"/></font></fonts>
<fills count="4"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF4F46E5"/><bgColor indexed="64"/></patternFill></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEEF2FF"/><bgColor indexed="64"/></patternFill></fill></fills>
<borders count="3"><border><left/><right/><top/><bottom/><diagonal/></border><border><left/><right/><top/><bottom style="thin"><color rgb="FF4F46E5"/></bottom><diagonal/></border><border><left/><right/><top style="medium"><color rgb="FF1E1B4B"/></top><bottom/><diagonal/></border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="18">
<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>
<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>
<xf numFmtId="0" fontId="3" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment vertical="center" wrapText="1"/></xf>
${['0','164','3','168','165','166','167'].map(f=>`<xf numFmtId="${f}" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>`).join('')}
${['0','164','3','168','165','166','167'].map(f=>`<xf numFmtId="${f}" fontId="4" fillId="3" borderId="2" xfId="0" applyNumberFormat="1" applyFont="1" applyFill="1" applyBorder="1"/>`).join('')}
</cellXfs>
<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>
</styleSheet>`;
  function xcell(ref, c, tot){
    const base=(tot?11:4)+Math.max(0,TIPI.indexOf(c.tipo||'testo'));
    const v=c.v;
    if(c.f) return `<c r="${ref}" s="${base}"><f>${xesc(c.f)}</f>${v!=null&&v!==''&&isFinite(Number(v))?`<v>${Number(v)}</v>`:''}</c>`;
    if(v==null||v==='') return tot?`<c r="${ref}" s="${base}"/>`:'';
    const testo=()=>`<c r="${ref}" s="${(tot?11:4)}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
    if(isNum(c.tipo)){ const n=typeof v==='number'?v:Number(v); return isFinite(n)?`<c r="${ref}" s="${base}"><v>${n}</v></c>`:testo(); }
    if(c.tipo==='data'||c.tipo==='dataora'){ if(!/^\d{4}-\d{2}-\d{2}/.test(String(v))) return testo(); const n=serial(v); return isFinite(n)?`<c r="${ref}" s="${base}"><v>${n}</v></c>`:testo(); }
    return testo();
  }
  function sheetXML(rep, s){
    const nc=s.colonne.length, R0=5, rows=[];
    const len=(c)=>{ const {v,tipo}=c; if(v==null) return 0; if(tipo==='eur') return fEur(v).length+1; if(tipo==='data') return 10; if(tipo==='dataora') return 16; if(tipo==='pct') return 7; return String(v).length; };
    const w=s.colonne.map((col,j)=>Math.min(60,Math.max(col.t.length+2, ...s.righe.slice(0,800).map(r=>len(cell(r[j],col))+2), s.totale?len(cell(s.totale[j],col))+2:0, 8)));
    rows.push(`<row r="1" ht="22" customHeight="1">${xcell('A1',{v:rep.titolo+(rep.sezioni.length>1?' — '+s.nome:''),tipo:'testo'}).replace(/s="4"/,'s="1"')}</row>`);
    rows.push(`<row r="2">${xcell('A2',{v:rep.sottotitolo,tipo:'testo'}).replace(/s="4"/,'s="2"')}</row>`);
    rows.push(`<row r="4" ht="20" customHeight="1">${s.colonne.map((c,j)=>`<c r="${colL(j)}4" s="3" t="inlineStr"><is><t>${xesc(c.t)}</t></is></c>`).join('')}</row>`);
    s.righe.forEach((r,i)=>{ const n=R0+i; rows.push(`<row r="${n}">${r.map((v,j)=>xcell(colL(j)+n,cell(v,s.colonne[j]))).join('')}</row>`); });
    const last=R0+s.righe.length-1;
    if(s.totale){ const n=last+1;
      rows.push(`<row r="${n}">${s.totale.map((v,j)=>{ const col=s.colonne[j]; const c=cell(v,col);
        if(col.somma && s.righe.length) c.f=`SUBTOTAL(9,${colL(j)}${R0}:${colL(j)}${last})`;
        return xcell(colL(j)+n,c,true); }).join('')}</row>`); }
    const filt = s.righe.length ? `<autoFilter ref="A4:${colL(nc-1)}${last}"/>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheetPr>${s.righe.length?'<pageSetUpPr fitToPage="1"/>':''}</sheetPr>
<sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A5" sqref="A5"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols>${w.map((x,j)=>`<col min="${j+1}" max="${j+1}" width="${x.toFixed(1)}" customWidth="1"/>`).join('')}</cols>
<sheetData>${rows.join('')}</sheetData>${filt}
<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/>
<pageSetup paperSize="9" orientation="${nc>6?'landscape':'portrait'}" fitToWidth="1" fitToHeight="0"/>
<headerFooter><oddFooter>&amp;L${xesc(rep.titolo)}&amp;RPagina &amp;P di &amp;N</oddFooter></headerFooter>
</worksheet>`;
  }
  function xlsx(rep){
    const secs=rep.sezioni.filter(s=>s.colonne); const usati=new Set();
    const nomi=secs.map(s=>{ let n=(s.nome||'Foglio').replace(/[\[\]:*?\/\\]/g,' ').slice(0,31).trim()||'Foglio'; let k=n,i=2; while(usati.has(k.toLowerCase())) k=n.slice(0,28)+' '+(i++); usati.add(k.toLowerCase()); return k; });
    const files=[
      ['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>${secs.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
      ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`],
      ['docProps/core.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${xesc(rep.titolo)}</dc:title><dc:creator>Renko Retail</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString().slice(0,19)}Z</dcterms:created></cp:coreProperties>`],
      ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${nomi.map((n,i)=>`<sheet name="${xesc(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><definedNames>${secs.map((s,i)=>s.righe.length?`<definedName name="_xlnm._FilterDatabase" localSheetId="${i}" hidden="1">'${xesc(nomi[i]).replace(/'/g,"''")}'!$A$4:$${colL(s.colonne.length-1)}$${4+s.righe.length}</definedName><definedName name="_xlnm.Print_Titles" localSheetId="${i}">'${xesc(nomi[i]).replace(/'/g,"''")}'!$4:$4</definedName>`:'').join('')}</definedNames></workbook>`],
      ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${secs.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${secs.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/styles.xml',STYLES],
      ...secs.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`, sheetXML(rep,s)])
    ];
    scarica(rep.file+'.xlsx', zip(files));
  }

  /* ---------------- PDF (Helvetica, WinAnsi) ---------------- */
  const WID={H:[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584,761,556,500,222,556,333,1000,556,556,333,1000,667,333,1000,500,611,500,500,222,222,333,333,350,556,1000,333,1000,500,333,944,500,500,667,278,333,556,556,556,556,260,556,333,737,370,556,584,333,737,333,400,584,333,333,333,556,537,278,333,333,365,556,834,834,834,611,667,667,667,667,667,667,1000,722,667,667,667,667,278,278,278,278,722,722,778,778,778,778,778,584,778,722,722,722,722,667,667,611,556,556,556,556,556,556,889,500,556,556,556,556,278,278,278,278,556,556,556,556,556,556,556,584,611,556,556,556,556,500,556,500], B:[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584,761,556,500,278,556,500,1000,556,556,333,1000,667,333,1000,500,611,500,500,278,278,500,500,350,556,1000,333,1000,556,333,944,500,500,667,278,333,556,556,556,556,280,556,333,737,370,556,584,333,737,333,400,584,333,333,333,611,556,278,333,333,365,556,834,834,834,611,722,722,722,722,722,722,1000,722,667,667,667,667,278,278,278,278,722,722,778,778,778,778,778,584,778,722,722,722,722,667,667,611,556,556,556,556,556,556,889,556,556,556,556,556,278,278,278,278,611,611,611,611,611,611,611,584,611,611,611,611,611,556,611,556]};
  const CP={0x20AC:128,0x201A:130,0x0192:131,0x201E:132,0x2026:133,0x2020:134,0x2021:135,0x02C6:136,0x2030:137,0x0160:138,0x2039:139,0x0152:140,0x017D:142,0x2018:145,0x2019:146,0x201C:147,0x201D:148,0x2022:149,0x2013:150,0x2014:151,0x02DC:152,0x2122:153,0x0161:154,0x203A:155,0x0153:156,0x017E:158,0x0178:159};
  const toAnsi=s=>{ let o=''; for(const ch of String(s??'')){ const c=ch.codePointAt(0); if(c===0x202F||c===0x00A0) o+=' '; else if(c>=32&&c<127) o+=ch; else if(c>=160&&c<256) o+=String.fromCharCode(c); else if(CP[c]) o+=String.fromCharCode(CP[c]); else if(c===9) o+=' '; else o+='?'; } return o; };
  const tw=(a,size,bold)=>{ const t=bold?WID.B:WID.H; let w=0; for(let i=0;i<a.length;i++){ const c=a.charCodeAt(i); w+=t[c-32]??556; } return w*size/1000; };
  const pesc=a=>a.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  const fit=(a,size,bold,maxw)=>{ if(tw(a,size,bold)<=maxw) return a; const el='\x85'; while(a.length>1 && tw(a+el,size,bold)>maxw) a=a.slice(0,-1); return a+el; };
  const rgb=h=>{ const n=parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255].map(x=>x.toFixed(3)).join(' '); };
  const fmtCell=c=>{ const {v,tipo}=c; if(v==null||v==='') return '';
    if((tipo==='data'||tipo==='dataora') && !/^\d{4}-\d{2}-\d{2}/.test(String(v))) return String(v);
    if(isNum(tipo) && !isFinite(Number(v))) return String(v);
    switch(tipo){ case 'eur': return fEur(v); case 'int': return fNum(v); case 'dec': return fQta(v); case 'pct': return fPct(v);
      case 'data': return fData(v); case 'dataora': return fData(v)+' '+String(v).slice(11,16); default: return String(v); } };

  function pdf(rep){
    const secs=rep.sezioni;
    const maxCols=Math.max(0,...secs.filter(s=>s.colonne).map(s=>s.colonne.length));
    const land = maxCols>6 || secs.some(s=>s.orizzontale);
    const PW=land?842:595, PH=land?595:842, M=34, CW=PW-2*M;
    const FS=8.5, RH=15, HH=18;
    const pages=[]; let ops=null, y=0;
    const T=(x,yy,a,size,bold,col='#111318')=>ops.push(`BT /${bold?'F2':'F1'} ${size} Tf ${rgb(col)} rg 1 0 0 1 ${x.toFixed(2)} ${yy.toFixed(2)} Tm (${pesc(a)}) Tj ET`);
    const RECT=(x,yy,w,h,col)=>ops.push(`${rgb(col)} rg ${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
    const LINE=(x1,y1,x2,y2,col,w=0.6)=>ops.push(`${rgb(col)} RG ${w} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    const nuovaPagina=()=>{ ops=[]; pages.push(ops); y=PH-M;
      T(M,y-14,fit(toAnsi(rep.titolo),15,true,CW),15,true,'#1E1B4B');
      T(M,y-28,fit(toAnsi(rep.sottotitolo),8.5,false,CW),8.5,false,'#6B7280');
      LINE(M,y-36,PW-M,y-36,'#4F46E5',1.2); y-=50; };
    const spazio=h=>{ if(y-h < M+24){ nuovaPagina(); return true; } return false; };
    nuovaPagina();

    for(const s of secs){
      if(s.grafico){
        const GH=s.grafico.altezza||150; spazio(GH+40);
        T(M,y-10,toAnsi(s.nome),11,true,'#1E1B4B'); y-=22;
        const d=s.grafico.dati, max=Math.max(0,...d.map(o=>o.v)), {top,step}=scalaNice(max);
        const padL=42, gx=M+padL, gw=CW-padL, gy=y-GH, band=gw/Math.max(1,d.length), bw=Math.max(1.5,Math.min(22,band*0.62));
        for(let t=0;t<=top+1e-9;t+=step){ const yy=gy+(t/top)*GH; LINE(gx,yy,gx+gw,yy,'#E6E7EB',0.5); const a=toAnsi(fAsse(t)); T(gx-6-tw(a,7,false),yy-2.5,a,7,false,'#7C8191'); }
        const ogni=Math.ceil(d.length/Math.max(1,Math.floor(gw/40)));
        d.forEach((o,i)=>{ const cx=gx+band*i+band/2, h=top?Math.max(0,o.v)/top*GH:0; if(h>0) RECT(cx-bw/2,gy,bw,h,'#2A78D6');
          if(i%ogni===0){ const a=toAnsi(o.x); T(cx-tw(a,7,false)/2,gy-10,a,7,false,'#7C8191'); } });
        LINE(gx,gy,gx+gw,gy,'#9CA3AF',0.7);
        y=gy-24; continue;
      }
      if(!s.colonne) continue;
      const cols=s.colonne, n=cols.length;
      const txt=(r)=>r.map((v,j)=>toAnsi(fmtCell(cell(v,cols[j]))));
      const body=s.righe.map(txt), tot=s.totale?txt(s.totale):null;
      // larghezze: contenuto (campione) + intestazione, scalate sulla pagina
      let w=cols.map((c,j)=>Math.max(tw(toAnsi(c.t),FS,true), ...body.slice(0,400).map(r=>tw(r[j],FS,false)), tot?tw(tot[j],FS,true):0)+12);
      w=w.map((x,j)=>cols[j].tipo==='testo'?Math.min(x,CW*0.45):x);
      const sum=w.reduce((a,b)=>a+b,0);
      if(sum>=CW) w=w.map(x=>x*CW/sum);
      else { const tx=cols.map((c,j)=>c.tipo==='testo'?j:-1).filter(j=>j>=0), ex=CW-sum;
             if(tx.length){ const st=tx.reduce((a,j)=>a+w[j],0); tx.forEach(j=>w[j]+=ex*w[j]/st); } else w=w.map(x=>x*CW/sum); }
      const xs=[]; w.reduce((a,b,i)=>(xs[i]=a,a+b),M);
      const right=j=>isNum(cols[j].tipo);
      const intest=()=>{ RECT(M,y-HH,CW,HH,'#4F46E5');
        cols.forEach((c,j)=>{ const a=fit(toAnsi(c.t),FS,true,w[j]-10); T(right(j)?xs[j]+w[j]-6-tw(a,FS,true):xs[j]+6, y-HH+5.6, a, FS, true, '#FFFFFF'); }); y-=HH; };
      spazio(HH+RH*3+26);
      T(M,y-10,toAnsi(s.nome),11,true,'#1E1B4B'); y-=20; intest();
      body.forEach((r,i)=>{
        if(spazio(RH)){ T(M,y-10,toAnsi(s.nome+' (segue)'),9,true,'#6B7280'); y-=18; intest(); }
        if(i%2===1) RECT(M,y-RH,CW,RH,'#F4F5F8');
        r.forEach((a,j)=>{ a=fit(a,FS,false,w[j]-10); T(right(j)?xs[j]+w[j]-6-tw(a,FS,false):xs[j]+6, y-RH+4.6, a, FS, false); });
        y-=RH;
      });
      if(!body.length){ T(M+6,y-RH+4.6,'Nessun dato',FS,false,'#7C8191'); y-=RH; }
      if(tot){ spazio(RH+2); LINE(M,y,M+CW,y,'#1E1B4B',1); RECT(M,y-RH-1,CW,RH+1,'#EEF2FF');
        tot.forEach((a,j)=>{ a=fit(a,FS,true,w[j]-10); T(right(j)?xs[j]+w[j]-6-tw(a,FS,true):xs[j]+6, y-RH+3.8, a, FS, true); }); y-=RH+1; }
      y-=18;
    }
    // piè di pagina
    const gen=toAnsi('Renko Retail · generato il '+new Date().toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}));
    pages.forEach((p,i)=>{ ops=p; LINE(M,M+12,PW-M,M+12,'#E6E7EB',0.6); T(M,M,gen,7.5,false,'#7C8191'); const a=`Pagina ${i+1} di ${pages.length}`; T(PW-M-tw(a,7.5,false),M,a,7.5,false,'#7C8191'); });

    // assemblaggio
    const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
    const fH=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const fB=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesId=objs.length+1+pages.length*2; const kids=[];
    pages.forEach(p=>{ const st=p.join('\n'); const c=add(`<< /Length ${st.length} >>\nstream\n${st}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 ${fH} 0 R /F2 ${fB} 0 R >> >> /Contents ${c} 0 R >>`)); });
    add(`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`);
    const cat=add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
    const info=add(`<< /Title (${pesc(toAnsi(rep.titolo))}) /Producer (Renko Retail) /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g,'').slice(0,14)}) >>`);
    let out='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'; const xref=[];
    objs.forEach((o,i)=>{ xref.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
    const xs0=out.length;
    out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+xref.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('');
    out+=`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R /Info ${info} 0 R >>\nstartxref\n${xs0}\n%%EOF`;
    const b=new Uint8Array(out.length); for(let i=0;i<out.length;i++) b[i]=out.charCodeAt(i)&255;
    scarica(rep.file+'.pdf', new Blob([b],{type:'application/pdf'}));
  }
  return {csv, xlsx, pdf};
})();

document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.ctx && S.preset!=='custom'){ const a=S.al; impostaPreset(S.preset); if(a!==S.al) carica(); } });
